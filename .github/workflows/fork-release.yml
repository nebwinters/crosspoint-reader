name: Fork Release

# Publishes a GitHub release with firmware.bin on every push to master so the
# reader's over-the-air updater (pointed at this fork in OtaUpdater.cpp) can
# install it unattended. The version is MAJOR.MINOR from platformio.ini with
# the workflow run number as PATCH, which is monotonic across runs, and the
# tag is the bare version (the updater parses "1.3.42"; see isUpdateNewer).

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          base=$(sed -n 's/^version *= *\([0-9]*\.[0-9]*\)\..*/\1/p' platformio.ini | head -1)
          test -n "$base"
          version="${base}.${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Bake the release version into the gh_release build (it reads [crosspoint] version).
          sed -i "s/^version *= *.*/version = ${version}/" platformio.ini
          grep -n '^version' platformio.ini

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build CrossPoint
        run: pio run -e gh_release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: CrossPoint fork ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Automated fork build of `${{ github.sha }}`.
            Installed unattended by readers running this fork's firmware (dashboard auto-update).
          files: |
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/partitions.bin
